name: Gallery

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Seed the live gallery one chunk at a time
        env:
          APIPROOF_URL: ${{ secrets.APIPROOF_URL }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APIPROOF_URL}" ] || [ -z "${ADMIN_TOKEN}" ]; then
            echo "Set repository secrets APIPROOF_URL and ADMIN_TOKEN. Model keys stay on the server."
            exit 1
          fi
          session="$(date -u +%Y%m%dT%H%M%SZ)"
          for _ in $(seq 1 120); do
            body="$(curl -sfS -X POST "${APIPROOF_URL%/}/api/admin/gallery/seed" \
              -H "authorization: Bearer ${ADMIN_TOKEN}" \
              -H "content-type: application/json" \
              -d "{\"session\":\"${session}\"}")"
            echo "${body}"
            if echo "${body}" | jq -e '.done == true' >/dev/null; then
              exit 0
            fi
          done
          echo "The gallery seed did not finish."
          exit 1
